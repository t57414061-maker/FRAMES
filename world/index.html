<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090909"><meta name="description" content="Explore countries and destinations across every world region with FRAME World.">
<meta property="og:title" content="FRAME World — Explore the world"><meta property="og:description" content="A destination atlas for curious minds and image-makers.">
<title>FRAME World — Explore the world</title>
<style>
:root{color-scheme:dark;--bg:#090909;--panel:#121211;--line:#393329;--fg:#f4f0e7;--mut:#aaa398;--gold:#c9a96e}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:90px}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.65 Manrope,system-ui,sans-serif}a{color:inherit;text-decoration:none}button,input{font:inherit}.wrap{width:min(1160px,calc(100% - 40px));margin:auto}
header{min-height:70px;display:flex;align-items:center;justify-content:space-between;gap:14px;border-bottom:1px solid var(--line);padding:12px max(20px,calc((100vw - 1160px)/2));position:sticky;top:0;background:#090909ed;backdrop-filter:blur(14px);z-index:10}
.brand{font-weight:800;letter-spacing:.28em;color:var(--gold)}.brand small{display:block;color:var(--mut);font-size:9px;letter-spacing:.34em;font-weight:600}.navlinks{display:flex;gap:18px;align-items:center;font-size:13px;color:var(--mut)}.navlinks a:hover{color:var(--gold)}
.hero{min-height:54vh;display:grid;align-items:center;text-align:center;padding:80px 20px;background:radial-gradient(ellipse at 50% 0,rgba(201,169,110,.17),transparent 60%),linear-gradient(180deg,#11110f,#090909)}.eyebrow{color:var(--gold);letter-spacing:.3em;text-transform:uppercase;font-size:11px}.hero h1{font:600 clamp(54px,10vw,108px)/.95 Georgia,serif;letter-spacing:-.04em;margin:20px 0}.hero h1 span{color:var(--gold);font-style:italic}.hero p{max-width:650px;margin:auto;color:#c1baad;font-size:clamp(15px,2vw,18px)}
.btn{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--gold);border-radius:5px;padding:10px 15px;background:linear-gradient(135deg,#dfc58e,#b28b4d);color:#17130c;font-size:13px;font-weight:800;cursor:pointer}.btn.ghost{background:transparent;color:var(--fg)}
section{padding:64px 0}.head{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:22px}.head h2{font:500 clamp(32px,5vw,46px)/1 Georgia,serif;margin:0}.head p{color:var(--mut);margin:8px 0 0}.regions{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}.region{min-height:150px;border:1px solid var(--line);background:linear-gradient(145deg,#191814,#10100f);padding:18px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;text-align:left;color:var(--fg)}.region:hover,.region.active{border-color:var(--gold)}.region .num{font-size:10px;letter-spacing:.2em;color:var(--gold)}.region h3{font:500 25px Georgia,serif;margin:14px 0 3px}.region p{font-size:11px;color:var(--mut);margin:0}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:0 0 18px}.search{flex:1;min-width:180px;max-width:360px;padding:11px 13px;background:#111;border:1px solid var(--line);border-radius:5px;color:var(--fg)}.count{color:var(--mut);font-size:12px}.countries{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.country{border:1px solid var(--line);background:var(--panel);padding:16px;border-radius:5px}.country h3{font:500 22px Georgia,serif;margin:0 0 3px}.country .capital{font-size:11px;color:var(--mut);margin-bottom:12px}.places{display:grid;gap:7px}.place{width:100%;text-align:left;border:1px solid #393329;background:#0c0c0b;color:var(--fg);padding:10px;border-radius:4px;cursor:pointer;font-size:12px}.place:hover{border-color:var(--gold);color:var(--gold)}.place small{display:block;color:var(--mut);font-size:10px;margin-bottom:2px}
.region-places{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.region-place{padding:18px;border:1px solid var(--line);background:var(--panel)}.region-place h3{font:500 22px Georgia,serif;margin:0 0 5px}.region-place p{color:var(--mut);font-size:12px;margin:0}
.detail{display:none;border:1px solid var(--gold);background:linear-gradient(145deg,#171510,#0f0f0e);padding:clamp(20px,4vw,34px);margin-top:24px}.detail.open{display:block}.detail-top{display:flex;justify-content:space-between;gap:12px;align-items:start}.detail h2{font:500 clamp(30px,5vw,48px)/1.1 Georgia,serif;margin:6px 0 12px}.detail p{max-width:780px;color:#c5beb2}.detail-meta{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--gold)}.detail-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px}.detail-grid div{padding:14px;border:1px solid var(--line);font-size:12px;color:var(--mut)}.detail-meta{margin-top:18px}.detail a{margin-top:10px}.detail-grid b{display:block;color:var(--fg);margin-bottom:4px}
.note{border:1px solid var(--line);padding:18px;color:var(--mut);font-size:12px;background:var(--panel);margin-top:18px}footer{border-top:1px solid var(--line);padding:28px 20px;text-align:center;color:var(--mut);font-size:12px}footer b{color:var(--gold);letter-spacing:.3em}
@media(max-width:850px){.regions{grid-template-columns:repeat(2,minmax(0,1fr))}.countries{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:520px){.wrap{width:calc(100% - 28px)}header{padding:11px 14px}.navlinks{gap:10px;font-size:11px}.hero{min-height:48vh}.regions,.countries,.region-places{grid-template-columns:1fr 1fr}.region{min-height:140px;padding:14px}.region h3{font-size:21px}.detail-grid{grid-template-columns:1fr}.country{padding:12px}}
@media(max-width:360px){.regions,.countries,.region-places{grid-template-columns:1fr}}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="./experience/frame-experience.css"><link rel="stylesheet" href="./country-experience.css"><link rel="stylesheet" href="./app.css">
</head>
<body>
<header><a class="brand" href="../" aria-label="FRAME Gallery">FRAME<small>WORLD</small></a><nav class="navlinks" aria-label="FRAME sections"><a href="../">FRAME Gallery</a><a href="#fw-discovery-view">Discover</a><a href="#fw-collections">Collections</a></nav></header>
<main><section id="frame-world-app" aria-label="FRAME World experience"></section></main>
<footer><b>FRAME WORLD</b><p>Explore with curiosity. Credit every creator.</p><a href="../">← Back to FRAME Gallery</a></footer>
<script src="./data.js"></script>
<script src="./research.js"></script>
<script src="./schema.js"></script>
<script src="./catalog.js"></script>
<script src="./experience/frame-experience.js"></script>
<script src="./country-experience.js"></script>
<script src="./images.js"></script>
<script src="./app.js"></script>
</body></html>
